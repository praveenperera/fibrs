[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fibrs"
# the version of Cargo.toml
dynamic = ["version"]
description = "Native drop-in for Qual's AVF_SPLINE_GENERATOR 0.2.0: traces AFV V/H fibre predictions into the same .afv"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{ name = "Praveen Perera", email = "me@praveenperera.com" }]
keywords = ["vesuvius-challenge", "herculaneum", "papyrus", "fibre-tracing", "afv", "avf-spline-generator", "inference", "cuda"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Environment :: GPU :: NVIDIA CUDA :: 12",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Image Processing",
]
# the direction field calls dsyevd from numpy's bundled OpenBLAS, so the tracer runs in an environment with numpy, as
# the reference does. macOS numpy wheels link Accelerate and bundle no OpenBLAS, so there the same OpenBLAS build as
# numpy 2.4.6's Linux wheel comes from scipy-openblas64
dependencies = ["numpy>=2", "scipy-openblas64==0.3.31.188.0; sys_platform == 'darwin'"]

[project.optional-dependencies]
# cuDNN 9 and cuBLAS 12 for `fibrs predict`, for a machine without them installed; the binary loads them from this
# environment's site-packages before the system's. NVIDIA ships both for Linux x86-64 only, where the binary has
# its GPU engine, so elsewhere the extra installs nothing
predict = [
  "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cublas-cu12>=12.1,<13; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# nvCOMP 6: installing this extra opts in to decoding prediction slabs on the GPU in trace finishing, which loads it
# from this environment's site-packages; without it, or with FIBRS_NVCOMP=off, they decode on the CPU with c-blosc's
# checks. nvCOMP's behaviour on a corrupt chunk is undefined. Linux x86-64 only, like the GPU engine
gpu-zstd = ["nvidia-libnvcomp-cu12>=6,<7; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[project.urls]
Repository = "https://github.com/praveenperera/fibrs"

[tool.maturin]
# the wheel installs the binary as the fibrs script, next to the environment's python, plus the Python
# entry (python -m fibrs) that finds it
bindings = "bin"
python-source = "python"
module-name = "fibrs"
python-packages = ["fibrs"]
# the release profile keeps line tables for profiling; the wheel does not need them
strip = true

# no CycloneDX SBOM in the wheel: maturin's records the absolute path of the checkout the wheel was built in
[tool.maturin.sbom]
rust = false

[tool.ruff]
line-length = 120
