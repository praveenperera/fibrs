[package]
name = "fibrs"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
description = "Native drop-in for Qual's AVF_SPLINE_GENERATOR 0.2.0: traces AFV V/H fibre predictions into the same .afv"
repository = "https://github.com/praveenperera/fibrs"
readme = "README.md"
keywords = ["vesuvius", "fibre", "tracing", "zarr", "cuda"]
categories = ["science", "command-line-utilities"]
# what a build reads: the sources, build.rs and the PTX src/gpu/cuda.rs embeds, so the crate needs no CUDA
# toolkit. ptx/ also holds the toolchain record and source hashes the kernel's provenance cites. The tests, their
# fixtures and the Python package stay in the repository
include = [
    "/src/**",
    "/build.rs",
    "/ptx/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/licenses/**",
]

[[bin]]
name = "fibrs"
path = "src/main.rs"

# cargo-binstall's download of the CLI archive a release attaches: fibrs-<version>-<target>.tar.gz holding
# fibrs-<version>-<target>/fibrs, for x86_64-unknown-linux-gnu and aarch64-apple-darwin, and
# fibrs-<version>-<target>.zip holding fibrs-<version>-<target>/fibrs.exe for x86_64-pc-windows-msvc. Any other
# target falls back to a source build. scripts/check-binstall.sh renders these against the archives package.yml
# builds
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
# the c-blosc release numcodecs 0.15 bundles (1.21.6), so every Blosc chunk the reference reads decodes here
# too: all of its codecs, byte and bit shuffle, split and unsplit blocks
blosc-src = { version = "0.3.8", features = ["lz4", "zlib", "zstd"] }
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6"
flate2 = "1"
# the per-run uuid and the temporary file names, from the system's random source as Python's os.urandom reads it
getrandom = "0.4"
half = "2"
libc = "0.2"
# numpy's own OpenBLAS supplies dsyevd, so the direction field is bitwise numpy.linalg.eigh
libloading = "0.9"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
memmap2 = "0.9"
# the global allocator (the default `mimalloc` feature): glibc malloc maps and unmaps large blocks while holding
# mmap_lock, which stalls every tracing thread's page faults on dense windows
mimalloc = { version = "0.1.52", optional = true }
# mi_collect, to hand the pages a stage freed back to the system (glibc's malloc_trim cannot reach mimalloc's)
libmimalloc-sys = { version = "0.1.49", optional = true, features = ["extended"] }
rayon = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
# float_roundtrip parses each JSON number to the f64 Python reads, so a value written and read back compares equal
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
zstd = "0.13"

# `fibrs predict`'s GPU engine, volkit's AfvV2, is CUDA-only: it is built in on Linux and Windows x86_64, and
# elsewhere `fibrs predict` plans a run (--dry-run) but refuses to start one. Cargo.lock pins the release; build.rs
# records it in the provenance from there
[target.'cfg(all(any(target_os = "linux", target_os = "windows"), target_arch = "x86_64"))'.dependencies]
volkit = "0.1.2"
# the free device memory for the column check, from the cudarc volkit already brings into the tree
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12040"] }

# Windows' memory, module-list and loader calls: the brick store's pages, the predictor's record of the cuDNN and
# cuBLAS DLLs it loaded; the version volkit already brings into the tree
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[features]
# `--no-default-features` builds with the system allocator
default = ["mimalloc"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[profile.release]
debug = 1
codegen-units = 4

# the sheet-strip runner (`fibrs strips`) needs volkit's device layer public, which only this local branch has
# (strips-device, 3cebf80); not for release
[patch.crates-io]
volkit = { path = "/home/praveen/.t3/worktrees/volkit/strips-device/volkit" }
