# Formatting, clippy and the tests on Linux x86_64, macOS arm64 and Windows x86_64. package.yml builds and installs
# the wheels and CLI archives

name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# a new push to a pull request supersedes its running checks
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    # MSVC links the test binaries more slowly
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-26
          # MSVC; CUDA loads at run time, so the build needs no toolkit
          - name: Windows x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # the committed kernel PTX (ptx/) was built from the kernel sources and toolchain it records; rebuilding it
      # needs cuda-oxide and a CUDA toolkit, so CI checks the hashes only
      - name: PTX matches its sources
        if: runner.os == 'Linux'
        run: scripts/check-ptx.sh

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # the tracer tests (tests/tile.rs) call dsyevd from numpy's OpenBLAS; scipy-openblas64 is the same build as a
      # wheel of its own, for Linux, macOS and Windows alike (pyproject.toml). A Windows venv keeps its python in
      # Scripts, and the path is written with / so that Git Bash and the binary both read it
      - name: Install numpy's OpenBLAS
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP//\\//}/lapack"
          uv venv -q "$venv"
          python="$venv/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then python="$venv/Scripts/python.exe"; fi
          uv pip install -q --python "$python" scipy-openblas64==0.3.31.188.0
          lib="$(find "$venv" -name 'libscipy_openblas64_*' \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) | head -1)"
          test -n "$lib"
          echo "FIBRS_LAPACK=$lib" >> "$GITHUB_ENV"

      # the unit tests, every reader fixture in tests/fixtures/readers, fibrs predict's plans, resume and argument
      # checks against the Python reference's (tests/predict.rs), and tiled tracing end to end (tests/tile.rs)
      - name: Tests
        run: cargo test --release --locked

      # the runners have no NVIDIA driver: a real run must stop there, before it reads the (placeholder) weights,
      # with an error, not a panic, and leave no output array behind
      - name: Predict without a GPU
        shell: bash
        run: |
          mkdir -p ci-model
          for f in model.py plans.json dataset.json checkpoint_final.pth; do echo "$f" > "ci-model/$f"; done
          set +e
          target/release/fibrs predict --ct tests/fixtures/predict/band.zarr --z0 0 --z1 8 \
            --model-dir ci-model --out ci-pred > predict.log 2>&1
          status=$?
          set -e
          cat predict.log
          test "$status" -eq 1
          grep -q '^fibrs predict: ' predict.log
          ! grep -q 'panicked' predict.log
          test ! -e ci-pred/semantic
          if [ "$RUNNER_OS" = macOS ]; then
            grep -q 'needs an NVIDIA GPU on Linux or Windows x86_64' predict.log
          else
            grep -q 'no NVIDIA driver found' predict.log
          fi

  python-lint:
    name: Python lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # pinned, because a ruff release that adds lints would otherwise fail an unchanged tree
      - name: Ruff
        run: uvx ruff@0.17.4 check python scripts
